# Tune the speed controller's PI gains on the built-in (mock) system.
# Run: embeddyn mechatronics tune examples/mechatronics/tuning/pi-mock.yaml
project: ../dc-motor.yaml
mock: true
duration: 1.0
parameters:
  controller.kp: {initial: 0.12, min: 0.01, max: 2.0, scale: log}
  controller.ki: {initial: 0.8, min: 0.05, max: 20.0, scale: log}
objective:
  - {metric: speed.itae, weight: 1.0}
  - {metric: current.rms, weight: 0.001}
constraints:
  - {metric: speed.overshoot, max: 5.0}
  - {metric: speed.settling_time, max: 0.6}
max_evaluations: 40
