# Tune both axes of the two-wheel drive at once (FMU wheel + geared wheel).
# Build the FMU first: python examples/mechatronics/fmus/rotational_load/build_fmu.py
project: ../two-wheel-drive.yaml
parameters:
  left.kp: {initial: 0.15, min: 0.02, max: 2.0, scale: log}
  left.ki: {initial: 1.5, min: 0.1, max: 20.0, scale: log}
  right.kp: {initial: 0.4, min: 0.02, max: 2.0, scale: log}
  right.ki: {initial: 2.0, min: 0.1, max: 20.0, scale: log}
objective:
  - {metric: left_speed.itae, weight: 1.0}
  - {metric: right_speed.itae, weight: 1.0}
constraints:
  - {metric: left_speed.overshoot, max: 5.0}
  - {metric: right_speed.overshoot, max: 5.0}
max_evaluations: 40
