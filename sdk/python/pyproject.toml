[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codelayer-forge-sdk"
version = "0.1.0"
description = "Python plugin SDK for CodeLayer Forge"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeLayer" }]

[tool.hatch.build.targets.wheel]
packages = ["codelayer_sdk"]
