schema_version: 1
kind: component-definition
category: actuator
identity:
  namespace: codelayer.motion
  name: dc-motor
  version: 1.0.0
ports:
  electrical:
    positive: {type: electrical_terminal}
    negative: {type: electrical_terminal}
  mechanical:
    shaft: {type: rotational_flange}
parameters:
  resistance: {type: quantity, unit: ohm, default: 2.0}
  inductance: {type: quantity, unit: H, default: 0.002}
  torque_constant: {type: quantity, unit: N*m/A, default: 0.08}
  rotor_inertia: {type: quantity, unit: kg*m^2, default: 0.0001}
models:
  reduced_order: {adapter: python, fidelity: 1}
  electrical: {adapter: ngspice, fidelity: 2}
  mechanical: {adapter: webots, fidelity: 2}
