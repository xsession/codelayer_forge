manifest_version = 1
id = "hu.codelayer.openhdl-designer"
name = "OpenHDL Designer"
version = "0.1.0"
publisher = "CodeLayer"
description = "HDL graph validation, analysis and structural Verilog generation."
runtime = "python"
entrypoint = "openhdl_designer.plugin:create_plugin"
platform_api = ">=0.1.0,<0.2.0"
supported_os = ["windows", "linux", "macos"]
activation_events = ["onWorkbench:hdl-design", "onFileExtension:.hdlgraph", "onCommand:openHdl.validateGraph"]

[provides]
"codelayer.hdl.graph" = "1.0.0"
"codelayer.hdl.codegen.verilog" = "1.0.0"

[requires]
"codelayer.routing.orthogonal" = ">=1.0.0,<2.0.0"

[permissions]
workspace_read = true
workspace_write = true
network = false
serial = false
usb = false
spawn_processes = []

[[contributes.workbenches]]
id = "hdl-design"
title = "HDL Design"
icon = "resources/hdl-design.svg"
order = 20

[[contributes.commands]]
id = "openHdl.validateGraph"
title = "Validate HDL Graph"
category = "OpenHDL Designer"

[[contributes.commands]]
id = "openHdl.generateVerilog"
title = "Generate Structural Verilog"
category = "OpenHDL Designer"

[[contributes.views]]
id = "openHdl.hierarchy"
title = "HDL Hierarchy"
location = "left"

[[contributes.views]]
id = "openHdl.problems"
title = "HDL Problems"
location = "bottom"

[[contributes.editors]]
id = "openHdl.graphEditor"
label = "HDL Block Diagram"
extensions = [".hdlgraph", ".fsmgraph"]
