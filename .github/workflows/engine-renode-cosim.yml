# Moved from engines/embeddyn/.github/workflows/renode-cosim.yml (monorepo); run steps execute in engines/embeddyn.
name: Renode co-simulation
# Builds Renode from xsession/renode `custom-cores` (cached per fork commit and
# patch set), builds the reference firmware and runs the real-Renode
# co-simulation tests (golden-trace check included), the libngspice tests and
# the full firmware + H-bridge example.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engines/embeddyn/embeddyn/mechatronics/**'
      - 'engines/embeddyn/examples/mechatronics/**'
      - 'engines/embeddyn/tests/mechatronics/**'
      - 'engines/embeddyn/externals/patches/renode-infrastructure/**'
      - 'engines/embeddyn/tools/renode/**'
      - 'engines/embeddyn/docs/reference/ngspice.md'
      - '.github/workflows/engine-renode-cosim.yml'

defaults:
  run:
    working-directory: engines/embeddyn

jobs:
  renode-cosim:
    name: Real Renode closed loop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RENODE_WORK: ${{ github.workspace }}/../renode-custom-cores
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install toolchains
        run: |
          sudo apt-get -qqy update
          sudo apt-get -qqy install gcc-arm-none-eabi binutils-arm-none-eabi libngspice0 cmake ninja-build gcc g++ curl git

      - name: Resolve fork commit
        id: fork
        run: |
          echo "sha=$(git ls-remote https://github.com/xsession/renode.git refs/heads/custom-cores | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Renode build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENODE_WORK }}
          key: renode-cc-${{ steps.fork.outputs.sha }}-${{ hashFiles('engines/embeddyn/externals/patches/renode-infrastructure/*.patch', 'engines/embeddyn/tools/renode/build-custom-cores.sh') }}

      - name: Build Renode (custom-cores)
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/renode/build-custom-cores.sh "$RENODE_WORK"

      - name: Build reference firmware
        run: |
          make -C examples/mechatronics/firmware/motor-speed-control
          make -C examples/mechatronics/firmware/rc-servo-l476

      - name: Install Embeddyn
        run: pip install -e . pytest

      - name: Real-Renode tests
        run: |
          . "$RENODE_WORK/env.sh"
          export RENODE_BIN="$RENODE_WORK/src/renode"
          pytest -q tests/mechatronics/test_renode_real.py tests/mechatronics/test_rc_servo_l476.py tests/mechatronics/test_ngspice_shared.py -rs
          embeddyn mechatronics run examples/mechatronics/dc-motor-full.yaml --output dc-motor-full.csv

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renode-cosim-logs
          path: |
            ${{ env.RENODE_WORK }}/build.log
            /tmp/pytest-of-*/**/renode.log
