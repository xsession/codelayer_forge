# Moved from engines/embeddyn/.github/workflows/mechatronics-verify.yml (monorepo); run steps execute in engines/embeddyn.
name: Mechatronics verification
# Fast checks without external simulators: unit tests plus `mechatronics verify`
# (energy balance, step-size convergence, golden waveforms, scenario matrix)
# on the examples built from the built-in, Python and FMU models.
on:
  workflow_dispatch:
  push:
    paths:
      - 'engines/embeddyn/embeddyn/mechatronics/**'
      - 'engines/embeddyn/examples/mechatronics/**'
      - 'engines/embeddyn/tests/mechatronics/**'
      - '.github/workflows/engine-mechatronics-verify.yml'

defaults:
  run:
    working-directory: engines/embeddyn

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Embeddyn
        run: pip install -e '.[fmi,mujoco]' pytest
      - name: Reference-FMUs (importer oracle)
        run: |
          python tools/fmi/fetch_reference_fmus.py "$RUNNER_TEMP/reference-fmus"
          echo "EMBEDDYN_REFERENCE_FMUS=$RUNNER_TEMP/reference-fmus" >> "$GITHUB_ENV"
      - name: Unit tests
        run: pytest -q tests/mechatronics -rs
      - name: Build example FMU
        run: python examples/mechatronics/fmus/rotational_load/build_fmu.py
      - name: Verify example models
        run: |
          mkdir -p verification
          embeddyn mechatronics verify examples/mechatronics/dc-motor.yaml -o verification/dc-motor.json
          embeddyn mechatronics verify examples/mechatronics/servo-drivetrain.yaml -o verification/servo-drivetrain.json
          embeddyn mechatronics verify examples/mechatronics/two-wheel-drive.yaml -o verification/two-wheel-drive.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: engines/embeddyn/verification/
