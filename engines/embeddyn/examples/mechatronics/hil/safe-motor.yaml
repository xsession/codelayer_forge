watchdog_timeout_seconds: 0.25
require_arm_token: true
emergency_stop_input: emergency_stop
trip_on_deadline_miss: true
maximum_deadline_misses: 2
outputs:
  motor_pwm:
    minimum: -1.0
    maximum: 1.0
    safe_value: 0.0
    slew_rate_per_second: 4.0
  relay_enable:
    minimum: 0.0
    maximum: 1.0
    safe_value: 0.0
