schema_version: 1
requirements:
  - id: SYS-PERF-001
    title: Shaft speed model RMSE
    verification:
      metric: signals.shaft_speed.rmse
      operator: <=
      value: 2.0
    evidence:
      - System model and measured shaft-speed capture
  - id: SYS-PERF-002
    title: Motor current maximum absolute error
    verification:
      metric: signals.motor_current.max_abs_error
      operator: <=
      value: 0.5
