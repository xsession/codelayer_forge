{
  "manifest": {
    "version": 1,
    "bootstrap_version": "1.1.0",
    "profiles": {
      "core": {
        "groups": [
          "core"
        ],
        "python_extras": []
      },
      "studio": {
        "groups": [
          "core"
        ],
        "python_extras": [
          "studio"
        ]
      },
      "full": {
        "groups": [
          "core",
          "tools",
          "rf-tools"
        ],
        "python_extras": [
          "studio",
          "mechatronics-storage",
          "rf"
        ]
      },
      "dev": {
        "groups": [
          "core",
          "tools",
          "rf-tools"
        ],
        "python_extras": [
          "studio",
          "mechatronics-storage",
          "test",
          "rf"
        ]
      },
      "rf": {
        "groups": [
          "core",
          "rf-tools"
        ],
        "python_extras": [
          "studio",
          "rf"
        ]
      }
    },
    "python": {
      "venv": ".venv",
      "lock_file": "requirements.lock.txt",
      "minimum": "3.9"
    },
    "workspace": {
      "path": "workspace",
      "zephyr_sdk": "0.16.3"
    },
    "projects": [
      {
        "name": "embeddyn-resources",
        "path": "workspace/embeddyn-resources",
        "url": "https://github.com/antmicro/visual-system-designer-resources.git",
        "revision": "main",
        "groups": [
          "core"
        ]
      },
      {
        "name": "renode-source",
        "path": "externals/renode",
        "url": "https://github.com/xsession/renode.git",
        "revision": "custom-cores",
        "groups": [
          "tools"
        ],
        "submodule": true
      },
      {
        "name": "openFPGALoader",
        "path": "externals/openFPGALoader",
        "url": "https://github.com/xsession/openFPGALoader.git",
        "revision": "HEAD",
        "groups": [
          "tools"
        ],
        "submodule": true
      },
      {
        "name": "open_microchip_tools",
        "path": "externals/open_microchip_tools",
        "url": "https://github.com/xsession/open_microchip_tools.git",
        "revision": "HEAD",
        "groups": [
          "tools"
        ],
        "submodule": true
      },
      {
        "name": "openocd",
        "path": "externals/openocd",
        "url": "https://github.com/xsession/openocd.git",
        "revision": "HEAD",
        "groups": [
          "tools"
        ],
        "submodule": true
      },
      {
        "name": "openems-project",
        "path": "externals/openEMS-Project",
        "url": "https://github.com/thliebig/openEMS-Project.git",
        "revision": "v0.0.36",
        "groups": [
          "rf-tools"
        ],
        "recursive": true
      }
    ],
    "system": {
      "required_commands": [
        "git",
        "cmake",
        "ninja",
        "gperf",
        "ccache",
        "dtc",
        "wget",
        "curl",
        "xz",
        "file",
        "make",
        "gcc",
        "g++",
        "node",
        "npm"
      ],
      "debian_packages": [
        "git",
        "cmake",
        "ninja-build",
        "gperf",
        "ccache",
        "dfu-util",
        "device-tree-compiler",
        "wget",
        "curl",
        "python3-dev",
        "python3-pip",
        "python3-setuptools",
        "python3-venv",
        "python3-tk",
        "python3-wheel",
        "xz-utils",
        "file",
        "make",
        "gcc",
        "g++",
        "gcc-multilib",
        "g++-multilib",
        "libsdl2-dev",
        "libmagic1",
        "pkg-config",
        "autoconf",
        "automake",
        "libtool",
        "texinfo",
        "libusb-1.0-0-dev",
        "libftdi1-dev",
        "libhidapi-dev",
        "libgpiod-dev",
        "libcapstone-dev",
        "nodejs",
        "npm"
      ]
    }
  }
}
